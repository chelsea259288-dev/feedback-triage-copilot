name = "feedback-triage"
main = "src/index.ts"
compatibility_date = "2024-10-22"
workers_dev = true

# Assets 配置（提供静态 HTML）
[assets]
directory = "./public"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "feedback_db"
database_id = "9167a5bd-164d-4cd5-8276-5a138de4375f"

# Workers AI 绑定（用于分析 + RAG 生成）
[ai]
binding = "AI"

# R2 存储绑定（用于语料库，供 AI Search 索引）
[[r2_buckets]]
binding = "CORPUS"
bucket_name = "feedback-triage-corpus"

# Workflows 绑定（异步分析流水线）
[[workflows]]
name = "feedback-triage-workflow"
binding = "TRIAGE_WORKFLOW"
class_name = "TriageWorkflow"

# 本地开发配置
[vars]
ENVIRONMENT = "development"
AI_SEARCH_NAME = "delicate-leaf-e8d2"
